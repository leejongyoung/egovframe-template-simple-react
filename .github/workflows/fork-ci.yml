name: Fork CI
on:
  pull_request:
    branches: [work]
  push:
    branches: [work]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'leejongyoung/egovframe-template-simple-react'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.19.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build --if-present
      - run: npm run test:run
        env:
          NODE_ENV: test
